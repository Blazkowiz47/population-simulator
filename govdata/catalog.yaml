  - "HH-05 City (households by number of aged 60+ persons x household size) and HH-06 City (households by head's marital status, sex and age), cities in KA/AP/MH including BBMP/GHMC/Greater Mumbai. HH-05: .../catalog/7367/download/10479/DDW-HH05CITY-2900-2011.XLS (73 KB), .../7366/download/10478/DDW-HH05CITY-2800-2011.XLS (112 KB), .../7365/download/10477/DDW-HH05CITY-2700-2011.XLS (102 KB). HH-06: .../7433/download/10545/DDW-HH06CITY-2900-2011.XLS (84 KB), .../7432/download/10544/DDW-HH06CITY-2800-2011.XLS (120 KB), .../7431/download/10543/DDW-HH06CITY-2700-2011.XLS (120 KB). All HEAD 200. Role: build (household head and elderly composition at city level)."
  - "HH-11: households with number of workers by household size, state/district (metadata 'state, district'). .../catalog/7608/download/10720/DDW-HH11-2900-2011.XLS (124 KB), .../7607/download/10719/DDW-HH11-2800-2011.XLS (102 KB), .../7606/download/10718/DDW-HH11-2700-2011.XLS (140 KB). HEAD 200. Role: build (workers per household)."
  - "B-01 City (main/marginal/non-workers by age and sex, cities; catalog 12696, DDWCT-0000B-01.xls 1960 KB) and C-08 City (education by age and sex, cities; catalog 2392, 3652 KB). Mentioned only in notes; they deserve their own catalog entries. Metadata lists BBMP/GHMC/Greater Mumbai as City units. Role: build (employment and education by age-sex at city level)."
  - "PCA SLUM: Primary census abstract for slums, India and states, town level, 2011 (catalog 6190). https://censusindia.gov.in/nada/index.php/catalog/6190/download/9267/slum_data_census_2011.xls (1619 KB, HEAD 200). Units include Greater Mumbai (M Corp.) (Part), GHMC (M Corp. + OG) (Part) and BBMP (M Corp. + OG) (Part). Role: build/check (slum share of population and households, important for Mumbai)."
  - "D-03 City: migrants within the state by last residence, duration of residence and reason, cities. KA .../catalog/10950/download/14062/CITY-2900-D03-MDDS.XLSX (2456 KB), MH .../10953/download/14065/CITY-2700-D03-MDDS.XLSX (4467 KB), AP .../10939/download/14051/CITY-2800-D03-MDDS.XLSX (7409 KB). HEAD 200; the KA metadata includes BBMP (M Corp. + OG) (Part). Role: build (migrant and duration-of-residence attributes)."
  - "F-09: women by present age and number of births last year by sex and birth order, state/district. KA .../catalog/4235/download/7312/2011-F09-2900-Rev4-MDDS.XLSX (102 KB), AP .../4234/download/7311/2011-F09-2800-Rev4-MDDS.XLSX (82 KB), MH .../4233/download/7310/2011-F09-2700-Rev4-MDDS.XLSX (117 KB). HEAD 200. Role: build (age-specific fertility for simulating births)."
  - "ORGI Vital Statistics on the same portal, needed to simulate a year of births and deaths. SRS Statistical Report 2024 (catalog 47152, SRS_STAT_2024.pdf, 20,228 KB). SRS Bulletin 2024 Vol 59-I (catalog 47150, 526 KB). SRS Abridged Life Tables 2020-2024 (catalog 47148, 3,553 KB). All HEAD 200 and published 2026-05-20. Geography: state, with rural/urban splits. Licence: Census website policy. Role: build (birth and death rates, life tables)."
  - "Report on Vital Statistics of India based on the Civil Registration System 2024 (catalog 47155, CRS_Report_2024.pdf, 6,143 KB, HEAD 200, posted 2026-07-01) and Annual Report on MCCD 2024 (catalog 47157, 11,802 KB, HEAD 200). Role: check (registered births/deaths and cause of death)."
  - "Not ORGI, but closely tied to the Census: Population Projections for India and States 2011-2036, Report of the Technical Group on Population Projections (National Commission on Population, MoHFW). https://nhm.gov.in/New_Updates_2018/Report_Population_Projection_2019.pdf (HTTP 200, 11,272 KB PDF). State totals by urban/rural and age-sex. Role: build (scale the 2011 base to 2026). The main.mohfw.gov.in copy gave no response today."
  - "HH-02 City (houseless households by size, cities), e.g. https://censusindia.gov.in/nada/index.php/catalog/7298/download/10410/DDW-HH02CITY-2900-2011.XLS (32 KB, HEAD 200). Role: check (households omitted from normal-household counts)."
  - "Possible official mirror while data.gov.in is down: NITI Aayog NDAP (https://ndap.niti.gov.in/, HTTP 200 today). It is reported to republish Census 2011 tables, but its contents and licence were not checked (it is a JavaScript single-page app). Verify before relying on it."
  - "ASUSE 2025 district report 'Unincorporated Sector at the District Level: Insights from ASUSE 2025' (MoSPI publication id 2862, 10 Sep 2026; PDF 5,422,913 bytes, 176 pp). Per-state Excel appendices cover all districts, e.g. https://www.mospi.gov.in/uploads/documents/documents/1789033599362-Karnataka.xlsx (14,505 B), ...1789033680295-Maharashtra.xlsx (15,148 B), ...1789033935652-Telangana.xlsx (14,890 B). District counts of informal establishments and workers (Bengaluru (Urban) 5,01,393 establishments; Mumbai Suburban; Thane). Category A, open. Role: check informal workplace totals by district."
  - "ASUSE 2025 unit-level data, NADA catalog 293 (Jan-Dec 2025, 357 variables, login, Category B, aggregates-only), with the ASUSE 2025 full report (pub id 2824) and factsheet (id 2812). Establishment-level informal enterprises with district codes and workers. Role: build for informal job locations and sizes. The city/district reports above are the matching checks."
  - "NSS 76th round 'Drinking Water, Sanitation, Hygiene and Housing Condition' (Jul-Dec 2018), NADA 153 (Category B) and Report 584 (https://www.mospi.gov.in/sites/default/files/publication_reports/Report_584_final_0.pdf, about 45 MB). It has household variables 'Maximum distance travelled - male/female/transgender earners' (commute distance) plus dwelling characteristics. Role: build for the commute-distance distribution and housing."
  - "NSS 79th round Comprehensive Annual Modular Survey (CAMS) 2022-23, NADA 220 and report (pub id 375). Household variables: low-capacity public transport stop within 0.5 km, high-capacity (train/metro/ferry) stop within 1 km, all-weather road within 2 km. Role: build or check public-transport access by state x sector."
  - "NSS 78th round Multiple Indicator Survey 2020-21, NADA 218 and report (archival id 2671, MultipleIndicatorSurveyinIndiaf.pdf). Variable b4q33: urban household's nearest public transport within 0.5 km; also migration and assets. Role: check transit access."
  - "Comprehensive Modular Survey: Education 2025 (NSS 80th round), NADA 255 and report (pub id 2702, CMS_E_2025L.pdf, 17,016,577 B). Per-student 'school_exp_transport' and coaching transport expenditure. Role: build education-trip costs, with the report tables as check."
  - "NSS 75th round Household Social Consumption: Education 2017-18, NADA 151. Variables Transport_mode (mode of transport to school), Transport_amt, and distance to nearest primary/secondary/upper school. Role: build the school-trip mode and distance model."
  - "NSS 77th round Debt and Investment (AIDIS) 2019, NADA 156 (Category B). Household assets including transport equipment and debt. Role: build vehicle and asset ownership and wealth."
  - "Survey on Household Social Consumption: Health (Jan-Dec 2025, NSS 80th round), NADA 290, and Report 596 (pub id 2819). Includes 'Transport for patient (Rs.)'. Role: build or check the cost of healthcare trips (minor)."
  - "Consumer Price Index via eSankhyiki API /api/cpi/getCPIIndex and getItemIndex. State x rural/urban monthly group indices, including Fuel & Light and Transport; base 2012 has data to Dec 2025, and base 2024 is in the spec. Category A. Role: build monthly cost inflation over the simulated year."
  - "Energy Statistics India 2026 (pub id 2817, 30 Mar 2026; chapter innerpage works: https://www.mospi.gov.in/publications-reports/innerpage/2817). Full PDF uploads/publications_reports/...Energy_Statistics_India_2026_Final.pdf (20,123,923 B); Chapter 6 covers energy consumption. Category A. Role: check fuel-consumption totals."
  - "Migration in India 2020-21 (PLFS 2020-21 migration module; archival id 1444, https://www.mospi.gov.in/sites/default/files/publication_reports/Migration%20in%20India%20RL16082023.pdf, 13.7 MB), with unit data NADA 206. Role: build household-formation and migrant-share priors."
  - "Annual Survey of Industries 2023-24 unit data, NADA 256 (Category B). Factory-level employment with state and district. Role: build formal manufacturing workplaces."
  - "Note: data.gov.in was still unreachable on re-check (data.gov.in:443 connection refused; www.data.gov.in HTTP 503), so MoSPI mirrors there could not be checked."
  - "DULT 'Bangalore Mobility Indicators' 2008 and 2011 (official DULT PDFs; Wayback has https://dult.karnataka.gov.in/assets/front/pdf/bangalore_mobility_indicators-2008.pdf, 11,307,607 bytes, Last-Modified 2021-03-04, and Bangalore_Mobility_Indicators_(22-12-2011).pdf). Household travel and mode-share indicators for Bengaluru. Use to calibrate the build, or hold out as a check. Licence: Karnataka CeG policy, permission needed."
  - "Telangana Open Data 'GTFS for MMTS Hyderabad' (data.telangana.gov.in/dataset/gtfs-mmts-hyderabad, Wayback 2021-04-14). Suburban rail supply for Hyderabad (build). Licence label OGL-India. Portal timed out today."
  - "Telangana Open Data, other RTA datasets: 'Regional Transport Authority Vehicle Online Sales Data', 'Vehicle Life Tax Data', 'Fitness Certificate Data' and 'Dealers Data' (Wayback 2020–2021). New-sales and fleet-composition checks for Hyderabad; record-level, so commit aggregates only."
  - "Karnataka Transport Department FY annual Bengaluru vehicle statements (storage/pdf-files/2022-23 bng veh.pdf, 21-22 bng veh reports.pdf) and the statewide statements. City vehicle stock series (check). Site unreachable today; Wayback only; CeG policy needs permission."
  - "BMRCL Namma Metro ridership page (https://english.bmrc.co.in/ridership/, HTTP 200 on 2026-10-03). Official daily or periodic metro ridership for Bengaluru, to check simulated boardings. Terms not reviewed in this pass."
  - "BEST Undertaking (BMC) bus statistics, for Mumbai bus ridership and fleet checks. bestundertaking.com returned HTTP 200 but the guessed statistics page returned 404; the stats page URL still needs locating."
  - "MCGM Vital Statistics reports (portal.mcgm.gov.in, 'qlvitalstatisticsreport'). Annual births and deaths for rolling the Mumbai population forward to the simulated year (build/check). There is a saved page in ogdstate, but it was not listed in the survey."
  - "Census 2011 houselisting asset table HH-12/HL-12: households with bicycle, scooter/motorcycle/moped and car/jeep/van. This gives vehicle-ownership marginals for the build. 36 state files exist on censusindia (PC11_HL12), and an OGD mirror probably exists but could not be checked because data.gov.in returned 503."
  - "Census 2011 HH-01 City: normal households by household size, for cities (30 state files on censusindia). Household-size marginals for Bengaluru, Hyderabad and Mumbai (build); city-level, unlike B-28."
  - "NCRB ADSI 2023 Table 1A.11 resource on OGD: 'State/UT/City-wise and Place of Occurrence-wise Road Accident Deaths during 2023'. Direct CSV https://www.data.gov.in/files/ogdpv2dms/s3fs-public/NCRB_ADSI_2023_Table_1A.11.csv, 19,891 bytes, open access (check)."
  - "Telangana Open Data Portal, 'Regional Transport Authority Vehicle Registrations Data' (Transport Department, Telangana). Record-level registrations with RTA office, fuel, body type, make and approval date, in monthly resources; the AIKosh mirror says 2014 to January 2025. Licence: Open Government License-India. Landing https://data.telangana.gov.in/dataset/regional-transport-authority-vehicle-registrations-data timed out today; Wayback has captures 2021-2025. Mirror https://aikosh.indiaai.gov.in/home/datasets/details/telangana_regional_transport_authority_rta_vehicle_registrations_dataset.html returns 200. It contains registration numbers, so commit aggregates only. Role: check. It is the main RTO-level source for Hyderabad registrations before the March 2026 move to VAHAN, which contradicts 'no Hyderabad history'. The same portal has RTA life-tax, online-sales, dealers and fitness-certificate datasets."
  - "Telangana Open Data Portal, 'GTFS MMTS Hyderabad' (South Central Railway suburban schedules), https://data.telangana.gov.in/dataset/gtfs-mmts-hyderabad. Portal timed out today. Role: build (Hyderabad suburban rail network)."
  - "DULT Karnataka Transit Data Hub, https://tdh.dult-karnataka.com. Official BMTC and BMRCL GTFS static feeds, announced June 2024. DNS did not resolve today; licence unverified. Role: build (Bengaluru bus and metro network)."
  - "NCRB 'Accidental Deaths & Suicides in India 2024' (MHA), traffic-accident tables for 53 million-plus cities. Press reports 73,426 accidents and 17,797 deaths in 2024, with Bengaluru at 894 deaths. Listing https://www.ncrb.gov.in/accidental-deaths-suicides-in-india-year-wise.html?year=2024 returns 200 but is JS-rendered, so files and terms are unverified. Role: check (independent police series to compare with MoRTH city tables)."
  - "Mumbai Traffic Police, 'Mumbai Road Safety Annual Report' 2020-2023 (Marathi) and 'e-Challan Annual Report 2024'. Listing at trafficpolicemumbai.maharashtra.gov.in, document-category 'वार्षिक अहवाल', returns 200. The 2023 PDF is https://cdnbbsr.s3waas.gov.in/s3d827f12e35eae370ba9c65b7f6026695/uploads/2025/02/202502212128182597.pdf (HEAD 200, 10,425,509 bytes). The site's copyright policy requires permission by email. Role: check (Mumbai crashes, finer detail than MoRTH)."
  - "Bengaluru Traffic Police accident statistics (btp.gov.in, btp.karnataka.gov.in) and Hyderabad traffic police statistics (htp.gov.in, hyderabadpolice.gov.in). All timed out today. Role: check (monthly city crash counts)."
  - "Comprehensive Mobility Plan for Bengaluru 2020 (DULT/BMRCL). Household travel survey results: trip rate 1.24 including walk, mode shares, trip lengths by mode, household vehicle ownership, transport spend share. dult.karnataka.gov.in timed out and urbantransport.karnataka.gov.in does not resolve; I could not verify an official copy (an OpenCity mirror exists but is not a government source). Role: build (trip-rate and mode-share priors)."
  - "Hyderabad Comprehensive Transportation Study / CMP (HMDA, about 2011; HUMTA) and MMRDA CTS household surveys (trip rates, mode shares). hmda.gov.in returns 200; humta.telangana.gov.in does not resolve; I located no data files. Role: build."
  - "Parivahan Sarathi public dashboard (driving licences by state and RTO), https://analytics.parivahan.gov.in/analytics/publicdashboard/sarathi?lang=en. Returned HTTP 401 today. Role: check (licence-holder counts)."
  - "Earlier MoRTH SRTU reviews: 2017-18 & 2018-19 (https://morth.gov.in/backend/documents/uploaded/1755601634_SRTU%20final%202017-18%20&%202018-19_0.pdf) and 2010-11 to 2016-17, all on the MoRTH reports listing. Pre-COVID passengers carried for BMTC, BEST and TSRTC. Role: check / trend."
  - "MoRTH Annual Report 2025-26 (https://morth.gov.in/backend/documents/uploaded/RTH%20Annual%20Report%20English.pdf, on the reports listing). Latest national vehicle and road-safety summaries. Role: check (national context)."
  - "Economic Survey 2025-26 Statistical Appendix Table 1.26, https://www.indiabudget.gov.in/economicsurvey/doc/stat/tab1.26.pdf (200). Indian Railways passengers, suburban and non-suburban, national only. An official fallback while indianrailways.gov.in is unreachable."
  - "Census 2011 B-28, 'Other workers by distance from residence to place of work and mode of travel' (city/district). Probably covered by the census group; it is the key build input for commute mode and distance."
  - "ISRO Bhuvan SIS-DP Phase-II district land use/land cover at 1:10K, in the bhuvan-vec1 WMS (https://bhuvan-vec1.nrsc.gov.in/bhuvan/wms). Layers: sisdpv2:KA_Banglore_lulc_v2, KA_Banglore_Rural_lulc_v2, MH_Mumbai_lulc_v2, MH_Mumbai_Suburban_lulc_v2, MH_Thane_lulc_v2, MH_Palghar_lulc_v2, TS_Hyderabad_lulc_v2, TS_Rangareddy_lulc_v2, plus sisdp:MUMBAI_ROAD10K and THANE_ROAD10K. Reachable (200). NRSC thematic policy applies: view and derive only, credit required. Role: build. It gives fine-scale land use for placing homes and workplaces in all three cities, which NUIS does not cover."
  - "AIKosh (IndiaAI Mission, MeitY), https://aikosh.indiaai.gov.in. A reachable official mirror of data.gov.in (OGD) resources while data.gov.in is down. Examples: NFHS-5 district fact-sheet XLS, NIHFW hospital_directory.csv, and 'HMIS Key Performance Indicators for All States - Year, State and District'. GODL licence per record; downloads for registered users. Role: build and check, as a fallback source."
  - "NITI Aayog National Data & Analytics Platform (NDAP), https://ndap.niti.gov.in (200). Official harmonised district-level datasets (NFHS, UDISE, etc.). Terms and access not checked. Role: check."
  - "MoHFW 'Health Dynamics of India (Infrastructure & Human Resources) 2022-23', formerly Rural Health Statistics (PIB PRID 2053070). District-level counts of SC/PHC/UPHC/CHC/SDH/DH and medical colleges as of 31 Mar 2023. The guessed mohfw.gov.in PDF path returned 404, so the URL needs locating. Role: check, for counts of healthcare destinations."
  - "HMIS, https://hmis.mohfw.gov.in (200). District and facility-wise health service reports for public facilities. Role: check, or a partial build source for public health facility lists."
  - "AISHE Higher Education Institution Directory (Ministry of Education), https://dashboard.aishe.gov.in/hedirectory/ (200). University and college directory by state and district. Role: build, for higher-education trip destinations. The AISHE report enrolment figures serve as a check."
  - "PPAC (Ministry of Petroleum) daily retail selling price of petrol and diesel in metro cities, including Mumbai. Example: https://ppac.gov.in/uploads/page-images/1790834244_PP_9_a_DailyPriceMSHSD_Metro_01.10.2026.pdf (200, 3,276,371 bytes). Also state VAT/sales-tax rates and price build-up pages, which can be used to work out Bengaluru and Hyderabad prices. Role: build, for fuel costs."
  - "National Housing Bank RESIDEX city housing price indices (Bengaluru, Hyderabad, Mumbai), https://residex.nhbonline.org.in. Timed out from this machine today. Role: build or check, for housing-cost inflation."
  - "Survey of India Village Boundary Database (OVSF/-/10, Rs 0, SHAPEFILE/GEODATABASE). Needs a portal login ('Click to Buy'). Also the Open Series Maps 1:50K PDF (OVSF/50K/51, free) and the paid NUIS Project 1:2K vector (OVSF/NUIS/2K/77, Rs 50 per sq km). Role: build, for sub-taluk geography."
  - "Telangana DES SEEEPC (Social, Educational, Employment, Economic, Political and Caste survey 2024), Volumes 1-4 and IEWG Volumes 1-2, at https://des.telangana.gov.in/publications/SEEEPC/. Also the Telangana State Indicator Framework 2025 (publications/TelanganaStateIndicatorFramework_2025.pdf). Host reachable. These are near-census household aggregates by district. Role: check, for Hyderabad-region household attributes."
  - "NFHS-5 (2019-21) state and district fact-sheet PDF compendiums, now on https://www.nfhsiips.in/nfhsuser/publication.php (the old rchiips.org location returns 404). Same form or guest-login access. Role: check (trend)."
  - "RBI HSIS 2024-25 tables beyond state income: Table 9 (urban unemployment), Table 17 (government hospitals and beds), Tables 108-111 (state CPI inflation including Housing-Urban), Table 151 (schools by management). Same landing page and terms. Role: check."
  - "Maharashtra DES Economic Survey 2025-26 companion files on the same page: ind_c_e.pdf, glance_e.pdf, highlights_eng.pdf. Also the MAHACES SASDash state-income XLSX files (NSDP_Current.xlsx, 16,524 bytes). Role: check."
