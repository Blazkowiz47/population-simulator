[project]
name = "traffic-simulator"
version = "0.1.0"
description = "A traffic simulator for Indian mixed traffic, built from scratch with open map data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
traffic-simulator = "traffic_simulator:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
